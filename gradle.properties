# =============================================================
#  McooServerFeatures —— Gradle 配置
#
#  【重要】本项目的版本坐标**只在本文件出现**。
#  将来跟随 Minecraft / Fabric 出新版本时，只改这里四处：
#      minecraft_version / loader_version / loom_version / fabric_api_version
#  其它文件一律不写死版本号。
#
#  版本坐标来源（改动时请以官方为准）：
#    - fabric-loader    https://meta.fabricmc.net/v2/versions/loader/<mc>
#    - fabric-api       https://modrinth.com/mod/fabric-api/versions
#    - loom             https://maven.fabricmc.net/net/fabricmc/fabric-loom/
# =============================================================

# ---------- Gradle 自身 ----------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.daemon=true
# 注意：暂不开启 configuration-cache，避免 Loom 与之的已知不兼容问题
# org.gradle.configuration-cache=true

# ---------- Minecraft / Fabric 坐标（唯一出处） ----------
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.161.0+26.2

# ---------- 本 mod 自身的坐标 ----------
# 版本号规则见 AGENTS.md §1.5：只用 x.z 两位。
#   x = 功能更新，每上线一个新功能 +1，并让 z 归零
#   z = bug 修复，每修一个线上 bug +1
# 纯基础设施改动（M1/M2/M3）不升版本号 —— 它们对使用者不可见。
mod_version=0.0
maven_group=com.mcoo
archives_base_name=mcoo-server-features
